name: Release APK

# Self-versioning Android releases with two fully isolated update channels:
#   main    -> vX.Y.Z            stable release and openflow.apk
#   testing -> vX.Y.Z-testing.N  prerelease and openflow-beta.apk
on:
  push:
    branches: [main, testing]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "docs/**"
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment relative to the latest stable release
        type: choice
        default: patch
        options: [patch, minor, major]
      publish:
        description: Publish a GitHub release
        type: boolean
        default: true

run-name: Release ${{ github.ref_name }} (${{ github.ref_name == 'main' && 'stable' || 'beta' }})

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BETA_POINTER_TAG: channel-testing

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
      version_code: ${{ steps.version.outputs.version_code }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve the next channel version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          node scripts/release-version.mjs --branch "$GITHUB_REF_NAME" --bump "$BUMP"
          echo "version_code=$((1000000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH:-true}" >> "$GITHUB_OUTPUT"

      - name: Tag and open a draft release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$CHANNEL" = "testing" ]; then
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --prerelease \
                --title "OpenFlow $TAG (beta)" --generate-notes
            else
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
                --title "OpenFlow $TAG" --generate-notes
            fi
          fi

  build:
    name: Test and build signed APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.1
          cache: true

      - name: Validate source and release scripts
        run: |
          node --test scripts/*.test.mjs
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Configure the persistent release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/openflow-release.p12"
          echo "OPENFLOW_ANDROID_KEYSTORE=$RUNNER_TEMP/openflow-release.p12" >> "$GITHUB_ENV"
          echo "OPENFLOW_ANDROID_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "OPENFLOW_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "OPENFLOW_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build channel-bound APK
        env:
          ORG_GRADLE_PROJECT_openflowChannel: ${{ needs.version.outputs.channel }}
          VERSION: ${{ needs.version.outputs.version }}
          VERSION_CODE: ${{ needs.version.outputs.version_code }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          set -euo pipefail
          flutter build apk --release \
            --build-name "$VERSION" \
            --build-number "$VERSION_CODE" \
            --dart-define "OPENFLOW_VERSION=$VERSION" \
            --dart-define "OPENFLOW_VERSION_CODE=$VERSION_CODE" \
            --dart-define "OPENFLOW_CHANNEL=$CHANNEL"
          mkdir -p release-assets
          if [ "$CHANNEL" = "testing" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk release-assets/openflow-beta.apk
          else
            cp build/app/outputs/flutter-apk/app-release.apk release-assets/openflow.apk
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: openflow-${{ needs.version.outputs.channel }}-${{ needs.version.outputs.version }}
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: openflow-${{ needs.version.outputs.channel }}-${{ needs.version.outputs.version }}
          path: release-assets

      - name: Build the channel update manifest
        run: |
          node scripts/android-update-manifest.mjs \
            --channel "${{ needs.version.outputs.channel }}" \
            --version "${{ needs.version.outputs.version }}" \
            --version-code "${{ needs.version.outputs.version_code }}" \
            --tag "${{ needs.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle-dir release-assets

      - name: Upload the APK and manifest to the versioned release
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.version.outputs.tag }}" \
            release-assets/* android-update*.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Keep an unpublished build as a workflow artifact
        if: needs.version.outputs.publish != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: openflow-unpublished-${{ needs.version.outputs.channel }}-${{ needs.version.outputs.version }}
          path: |
            release-assets/*
            android-update*.json
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, assemble]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.version.outputs.tag }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        if: needs.version.outputs.channel == 'testing'
        with:
          name: openflow-${{ needs.version.outputs.channel }}-${{ needs.version.outputs.version }}
          path: release-assets

      - name: Download the beta manifest
        if: needs.version.outputs.channel == 'testing'
        run: |
          gh release download "$TAG" --repo "$REPO" --pattern android-update-beta.json

      - name: Update the permanent beta channel pointer
        if: needs.version.outputs.channel == 'testing'
        run: |
          if ! gh release view "$BETA_POINTER_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$BETA_POINTER_TAG" --repo "$REPO" --prerelease \
              --title "OpenFlow beta channel" \
              --notes "Permanent download and update pointer for the testing branch."
          fi
          gh release upload "$BETA_POINTER_TAG" \
            android-update-beta.json release-assets/openflow-beta.apk \
            --repo "$REPO" --clobber

      - name: Make the completed release visible
        run: gh release edit "$TAG" --repo "$REPO" --draft=false
